name: corevent_work_app
description: "Corevent para Equipes: participantes e credenciamento de eventos."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  dio: ^5.11.1
  retrofit: ^4.10.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  go_router: ^18.0.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  remixicon: ^4.9.3
  mobile_scanner: ^7.4.2
  wakelock_plus: ^1.8.2
  permission_handler: ^12.0.1
  image_picker: ^1.2.3
  crop_your_image: ^2.0.0
  image: ^4.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  retrofit_generator: ^10.2.11
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_corevent_full.png
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-VariableFont_wght.ttf
