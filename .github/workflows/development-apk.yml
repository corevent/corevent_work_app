name: Development APK

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: development-apk
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publish:
    if: github.ref == 'refs/heads/develop'
    name: Publish development APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    env:
      COREVENT_API_URL: ${{ vars.COREVENT_API_URL }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate staging API
        run: |
          [[ "$COREVENT_API_URL" == https://* ]] || { echo '::error::Configure COREVENT_API_URL in the staging Environment'; exit 1; }
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v5
      - name: Install dependencies
        run: flutter pub get
      - name: Generate code
        run: dart run build_runner build
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test test --no-pub
      - name: Build development APK
        run: |
          flutter build apk --debug --flavor development --no-pub \
            --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define="COREVENT_API_URL=$COREVENT_API_URL"
      - name: Package APK and checksum
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-development-debug.apk dist/corevent-work-development.apk
          cd dist
          sha256sum corevent-work-development.apk > corevent-work-development.apk.sha256
      - name: Publish development pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="dev-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          printf 'Corevent para Equipes: APK de desenvolvimento conectado à API staging.\n\nCommit: %s\nModo: debug\nApplication ID: com.corevent.corevent_work_app.development\n' "$GITHUB_SHA" > "$RUNNER_TEMP/development-notes.md"
          gh release create "$tag" \
            dist/corevent-work-development.apk \
            dist/corevent-work-development.apk.sha256 \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Corevent Work Development ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            --notes-file "$RUNNER_TEMP/development-notes.md"
